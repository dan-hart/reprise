name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked --release
      - name: Check formatting
        run: cargo fmt --check
      - name: Verify command reference
        run: cargo run --locked --example generate_reference -- --check
      - name: Install completion test shells
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fish zsh
          command -v bash
          command -v zsh
          command -v fish
          command -v pwsh
      - name: Verify release packaging
        run: python scripts/test_package_release.py
      - name: Run tests
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked -- -D warnings

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Security audit
        run: cargo audit
