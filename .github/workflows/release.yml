name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            suffix: ''
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: ''
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            suffix: ''
          - runner: macos-15
            target: aarch64-apple-darwin
            suffix: ''
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            suffix: '.exe'
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Verify source
        shell: bash
        run: |
          python scripts/test_package_release.py
          cargo test --locked
          cargo clippy --locked -- -D warnings
          cargo run --locked --example generate_reference -- --check
      - name: Build and smoke test
        shell: bash
        run: |
          cargo build --locked --release --target "$RELEASE_TARGET"
          binary="target/$RELEASE_TARGET/release/reprise${{ matrix.suffix }}"
          test "$("$binary" --version)" = "reprise ${RELEASE_TAG#v}"
          "$binary" --help
          "$binary" completions bash > /tmp/reprise-completions.bash
          bash -n /tmp/reprise-completions.bash
      - name: Package
        run: python scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  draft:
    needs: binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and draft release
        shell: bash
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS
          printf 'Native binaries built and smoke-tested from commit %s. See CHANGELOG.md for changes.\n' "$GITHUB_SHA" > /tmp/reprise-release-notes.md
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)
            if [ "$draft" != true ]; then
              echo "Refusing to replace assets on published release $RELEASE_TAG" >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" ./* --clobber
          else
            gh release create "$RELEASE_TAG" ./* --verify-tag --draft --title "$RELEASE_TAG" --notes-file /tmp/reprise-release-notes.md
          fi
