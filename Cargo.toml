[package]
name = "reprise"
version = "0.2.0"
edition = "2021"
description = "A fast, feature-rich CLI for viewing build details from Bitrise"
license = "GPL-3.0-only"
repository = "https://github.com/dan-hart/reprise"
homepage = "https://github.com/dan-hart/reprise"
documentation = "https://github.com/dan-hart/reprise/blob/main/docs/cli-reference.md"
readme = "README.md"
keywords = ["bitrise", "ci", "builds", "cli", "devops"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# CLI parsing
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
serde_yaml_ng = "0.10"

# HTTP client
reqwest = { version = "0.12", features = ["blocking", "json"] }

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Output formatting
colored = "2"

# Error handling
thiserror = "2"

# URL handling
url = "2"

# Desktop notifications
notify-rust = "4"

# Signal handling
ctrlc = "3"

# TTY detection (for NO_COLOR and pipe detection)
is-terminal = "0.4"

# Terminal size detection (for dynamic column widths)
terminal_size = "0.4"

# Secure password input (for API token)
rpassword = "7"

tempfile = "3"

[dev-dependencies]
shell-words = "1"
assert_cmd = "2"
predicates = "3"
mockito = "1"

[profile.release]
lto = true
strip = true
opt-level = 3
codegen-units = 1
